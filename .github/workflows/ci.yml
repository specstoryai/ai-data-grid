name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - run: npm ci
            - run: npm run build
            - run: npm run check-pack
            - run: npm test -- --run
            - run: npm run test-cells -- --run
            - run: npm run test-source -- --run
